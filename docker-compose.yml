services:
  postgres:
    image: postgres:18
    container_name: secretary-postgres
    environment:
      POSTGRES_DB: secretary
      POSTGRES_USER: secretary
      POSTGRES_PASSWORD: secretary
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretary -d secretary"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
