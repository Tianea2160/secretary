[versions]
kotlin = "2.3.21"
spring-boot = "3.5.14"
dependency-management = "1.1.7"
spring-ai = "1.1.7"
koog = "1.0.0"
koog-beta = "1.0.0-beta"
telegrambots = "9.6.0"
hypersistence-tsid = "2.1.4"
ktfmt = "0.26.0"
commonmark = "0.28.0"
kotlinx-serialization = "1.11.0"
hibernate = "6.6.49.Final"

[libraries]
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }

spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-longterm-memory = { module = "ai.koog:agents-features-longterm-memory", version.ref = "koog-beta" }
koog-spring-ai-starter-model-chat = { module = "ai.koog:koog-spring-ai-starter-model-chat", version.ref = "koog-beta" }
koog-spring-ai-starter-model-embedding = { module = "ai.koog:koog-spring-ai-starter-model-embedding", version.ref = "koog-beta" }
koog-spring-ai-starter-chat-memory = { module = "ai.koog:koog-spring-ai-starter-chat-memory", version.ref = "koog-beta" }
koog-spring-ai-starter-vector-store = { module = "ai.koog:koog-spring-ai-starter-vector-store", version.ref = "koog-beta" }

spring-ai-starter-model-ollama = { module = "org.springframework.ai:spring-ai-starter-model-ollama" }
spring-ai-starter-chat-memory-jdbc = { module = "org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc" }
spring-ai-starter-vector-store-pgvector = { module = "org.springframework.ai:spring-ai-starter-vector-store-pgvector" }

spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-quartz = { module = "org.springframework.boot:spring-boot-starter-quartz" }
hibernate-vector = { module = "org.hibernate.orm:hibernate-vector", version.ref = "hibernate" }
postgresql = { module = "org.postgresql:postgresql" }

hypersistence-tsid = { module = "io.hypersistence:hypersistence-tsid", version.ref = "hypersistence-tsid" }

junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

telegrambots-springboot-longpolling-starter = { module = "org.telegram:telegrambots-springboot-longpolling-starter", version.ref = "telegrambots" }

telegrambots-client = { module = "org.telegram:telegrambots-client", version.ref = "telegrambots" }

commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }

[plugins]
org-springframework-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
io-spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
