name: Build Boot Image

on:
  push:
    branches:
      - release

permissions:
  contents: read
  packages: write

jobs:
  build-boot-image:
    name: Build and Push Boot Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/release' }}
          cache-cleanup: on-success

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pre-pull Paketo images
        run: |
          docker pull paketobuildpacks/builder-jammy-base &
          docker pull paketobuildpacks/run-jammy-tiny &
          wait

      - name: Create image tag
        id: image
        run: |
          echo "tag=$(TZ=Asia/Seoul date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Cache buildpack layers
        uses: actions/cache@v5
        with:
          path: |
            /tmp/cache-secretary.build
            /tmp/cache-secretary.launch
          key: paketo-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: |
            paketo-${{ runner.os }}-

      - name: Build and push image
        env:
          SECRETARY_ENV: ${{ secrets.SECRETARY_ENV }}
        run: |
          umask 077
          printf '%s\n' "$SECRETARY_ENV" > .env

          set -a
          . ./.env
          set +a

          ./gradlew bootBuildImage \
            -x test \
            --imageName ghcr.io/tianea2160/secretary:${{ steps.image.outputs.tag }} \
            --publishImage
