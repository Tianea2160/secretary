spring:
  application:
    name: secretary
  main:
    banner-mode: off
    web-application-type: none
  datasource:
    url: jdbc:postgresql://localhost:5435/secretary
    username: secretary
    password: secretary
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.scheduler.instanceName: secretary-scheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: "5"
      org.quartz.jobStore.isClustered: "false"
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
  ai:
    model:
      chat: ollama
      embedding: ollama
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          options:
            model: gemini-2.5-flash
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: phi4-mini:latest
      embedding:
        options:
          model: qwen3-embedding:8b
      init:
        pull-model-strategy: when_missing
        timeout: 10m
        max-retries: 1
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: 4096
secretary:
  chat:
    memory:
      window-size: 20
    long-term-memory:
      top-k: 5
  tracing:
    verbose: false
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  allowed-chat-ids: ${TELEGRAM_ALLOWED_CHAT_IDS:}
logging:
  file:
    name: logs/secretary.log
  level:
    root: info
    org.tianea: debug
  pattern:
    file: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
