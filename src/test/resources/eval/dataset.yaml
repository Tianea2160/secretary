# 배포 전 회귀 방지용 고정 평가 데이터셋.
# 각 item은 안정적인 기준답안(referenceAnswer)을 가지며, judge가 이를 기준으로 채점한다.
# id는 Langfuse dataset-item upsert 키로도 쓰이므로 변경하지 말 것(변경 시 새 item 생성).
items:
  - id: capital-france
    input: "What is the capital of France?"
    referenceAnswer: "The capital of France is Paris."
    tags: [factual, geography]

  - id: water-boiling-point
    input: "At what temperature does water boil at sea level, in Celsius?"
    referenceAnswer: "Water boils at 100 degrees Celsius at sea level (standard atmospheric pressure)."
    tags: [factual, science]

  - id: speed-of-light
    input: "Roughly how fast does light travel in a vacuum?"
    referenceAnswer: "Light travels at about 300,000 kilometers per second (299,792 km/s) in a vacuum."
    tags: [factual, science]

  - id: list-comprehension-python
    input: "In Python, how do you create a list of the squares of numbers 0 through 4 using a list comprehension?"
    referenceAnswer: "Use a list comprehension: [x**2 for x in range(5)], which yields [0, 1, 4, 9, 16]."
    tags: [coding, python]

  - id: json-vs-yaml
    input: "Name one practical difference between JSON and YAML as configuration formats."
    referenceAnswer: "YAML supports comments and is more human-readable with indentation-based structure, while JSON does not support comments and uses braces/brackets. (Either direction of this contrast is acceptable.)"
    tags: [factual, formats]

  - id: arithmetic-word-problem
    input: "If a train travels 60 km in 45 minutes, what is its average speed in km/h?"
    referenceAnswer: "80 km/h. (60 km in 0.75 hours = 60 / 0.75 = 80 km/h.)"
    tags: [reasoning, math]

  # 아래 항목들은 정답에 2개 이상의 필수 요소가 있어, 일부만 답하면 부분 점수(3~4)로 떨어진다.
  # 트리비아처럼 천장(5점)에 몰리지 않게 해 회귀 시 평균이 실제로 내려가도록 변별력을 만든다.
  - id: additive-primary-colors
    input: "What are the three primary colors of light in additive color mixing?"
    referenceAnswer: "Red, green, and blue. (All three are required.)"
    tags: [factual, science, completeness]

  - id: rectangle-area-and-perimeter
    input: "A rectangle measures 7 cm by 3 cm. What are both its area and its perimeter?"
    referenceAnswer: "Area is 21 cm² (7 × 3) and perimeter is 20 cm (2 × (7 + 3)). Both values are required."
    tags: [reasoning, math, completeness]

  - id: http-404-vs-500
    input: "In HTTP, what does a 404 status code mean, and separately, what does a 500 status code mean?"
    referenceAnswer: "404 means Not Found — the requested resource does not exist on the server. 500 means Internal Server Error — the server hit an unexpected condition. Both meanings are required."
    tags: [factual, web, completeness]

  - id: stack-vs-queue-ordering
    input: "What is the difference in element ordering between a stack and a queue?"
    referenceAnswer: "A stack is LIFO (last-in, first-out); a queue is FIFO (first-in, first-out). Both orderings must be stated and correctly matched."
    tags: [factual, cs, completeness]

  # 아래 항목들은 멀티턴/세션 know-how 시나리오다. turns로 발화 순서를 기술하고 마지막 턴만 채점한다.
  # 같은 session 라벨은 같은 대화(TSID)로, 다른 라벨은 같은 chatId 내 별개 세션으로 매핑된다.
  - id: pref-recall-coffee
    scenarioId: pref-recall-coffee
    referenceAnswer: "Black, no sugar."
    tags: [info-extraction]
    turns:
      - { input: "I take my coffee black, no sugar.", session: main }
      - { input: "How do I take my coffee?", session: main }

  - id: pref-recall-cross-session
    scenarioId: pref-recall-cross-session
    referenceAnswer: "Mochi."
    tags: [multi-session, info-extraction]
    turns:
      - { input: "My dog's name is Mochi.", session: a }
      - { input: "What's my dog's name?", session: b }

  - id: knowledge-update-editor
    scenarioId: knowledge-update-editor
    referenceAnswer: "VS Code. Must NOT say Vim."
    tags: [knowledge-update]
    turns:
      - { input: "My default editor is Vim.", session: main }
      - { input: "Actually I switched to VS Code.", session: main }
      - { input: "Which editor do I use?", session: main }

  - id: knowledge-update-diet
    scenarioId: knowledge-update-diet
    referenceAnswer: "A fish/seafood or pescatarian-appropriate protein. Must NOT suggest meat, and must NOT treat the user as strictly vegetarian."
    tags: [knowledge-update]
    turns:
      - { input: "I am vegetarian.", session: main }
      - { input: "I started eating fish, so I'm pescatarian now.", session: main }
      - { input: "Suggest a protein for me.", session: main }

  - id: abstention-unknown-movie
    referenceAnswer: "Should say it doesn't know / wasn't told. Must NOT invent a specific movie title."
    tags: [abstention]
    input: "What is my favorite movie?"

  - id: abstention-unknown-city
    referenceAnswer: "Should say it doesn't know. Must NOT fabricate a city name."
    tags: [abstention]
    input: "What city do I live in?"

  - id: multi-session-synthesis
    scenarioId: multi-session-synthesis
    referenceAnswer: "6."
    tags: [multi-session]
    turns:
      - { input: "I manage the payments team.", session: a }
      - { input: "I have 6 engineers.", session: b }
      - { input: "How many engineers report to me on payments?", session: c }

  - id: temporal-recency
    scenarioId: temporal-recency
    referenceAnswer: "Tuesday. Must NOT say Friday."
    tags: [temporal, knowledge-update]
    turns:
      - { input: "Last sprint our deploy day was Friday.", session: main }
      - { input: "This sprint we moved deploys to Tuesday.", session: main }
      - { input: "When do we deploy now?", session: main }

  - id: override-stale-instruction
    scenarioId: override-stale-instruction
    referenceAnswer: "An English greeting. Must NOT greet in Korean."
    tags: [knowledge-update]
    turns:
      - { input: "Always greet me in Korean.", session: main }
      - { input: "Stop that — English from now on.", session: main }
      - { input: "Say hello.", session: main }
